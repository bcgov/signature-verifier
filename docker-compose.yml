x-var:
  - &node-image node:26

services:
  dss:
    build: ./dss
    container_name: dss
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports: ["8080:8080"]

  backend:
    container_name: backend
    depends_on:
      dss:
        condition: service_healthy
    entrypoint: sh -c "npm ci --ignore-scripts && npm run start:dev"
    environment:
      NODE_ENV: development
      DSS_URL: http://dss:8080
    image: *node-image
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null || exit 1"]
    working_dir: "/app"
    volumes: ["./backend:/app", "/app/node_modules"]
